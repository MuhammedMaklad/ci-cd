name: Manual Dispatch Workflow from external system
on:
  repository_dispatch:
    types: [manual-dispatch]
jobs:
  manual-dispatch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Manual Dispatch Message
        run: echo "This workflow was triggered by a manual dispatch event from an external system."
      - name: Print Event Payload
        run: |
          echo "Triggered by external system!"
          echo "Environment requested: ${{ github.event.client_payload.environment }}"
          echo "User who triggered it: ${{ github.event.client_payload.user_name }}"
